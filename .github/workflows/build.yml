
name: Bishop BSG Tool Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Bishop_BSG_Tool.sln

      - name: Publish Windows x64
        run: >
          dotnet publish Bishop_BSG_Tool.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath Bishop_BSG_Tool_win-x64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bishop_BSG_Tool_win-x64
          path: Bishop_BSG_Tool_win-x64.zip
          if-no-files-found: error
          retention-days: 30
